title = "SIMULA history-aware secret scanning"

# These six values are SHA-256 hashes of Redis key names, not key values or
# credentials. Scope the exception to exact reviewed digests and evidence paths;
# other high-entropy values in the same files must continue to fail scanning.
[[allowlists]]
description = "Reviewed Redis name digests in 2026-09-05 structural recovery evidence"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(?:31343d7cff4beeca8a63646ee1d561c7d13b3c6e4ed5fe513fdff46b5355a2fc|4873d34c030d08986f71542863a77c5c478cd93f594ceba959fcf224f17c1f6d|5cb7e3b7f10f990573a760bca33b1290fbf9ec1d2ac2c6e1cc45a63f224f5f30|76d0e4e9202ed846fbb06c6788263c1a40eac44443be1bd61dda3bc641a85c11|ad72cd868983dc25667e78da0522986719991645018aa8693f23dab64e85c946|d566bc17f00688b4062a8f960e2854aa3494696a884af7a5033aef3b25046a74)$''',
]
paths = [
  '''^docs/audit/2026-09-05/redis-pre-alignment\.json$''',
  '''^docs/audit/2026-09-05/redis-post-alignment\.json$''',
  '''^docs/audit/2026-09-05/redis-post-auth-verification\.json$''',
]

[extend]
useDefault = true

[[allowlists]]
description = "Test-only idempotency replay identifiers are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''(?i)(?:create_key|rejected_key|idempotency[_-]?key|"Idempotency-Key")\s*[:=]''']
paths = [
  '''^tests/integration/test_rate_limits\.py$''',
  '''^services/api/tests/test_m2_routes\.py$''',
]

[[allowlists]]
description = "Deterministic synthetic cursor secrets in test-only runtime fixtures are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*(?:cursorSecret|SIMULA_CURSOR_SECRET)\s*:\s*"0123456789abcdef0123456789abcdef",?$''',
  '''^\s*const key = "organization-key-0001";$''',
]
paths = [
  '''^apps/api/src/organizations/cursor-codec\.spec\.ts$''',
  '''^apps/api/src/auth/supabase-token-verifier\.spec\.ts$''',
  '''^apps/api/src/domain/domain-runtime\.spec\.ts$''',
  '''^apps/api/src/methodology/methodology-engine\.spec\.ts$''',
  '''^apps/api/src/assets/visual-profile-engine\.spec\.ts$''',
  '''^apps/api/src/organizations/pg-organization-gateway\.spec\.ts$''',
  '''^apps/api/src/rate-limits/domain-rate-limiter\.integration-spec\.ts$''',
  '''^apps/api/src/rate-limits/domain-rate-limiter\.spec\.ts$''',
  '''^apps/api/test/database/organization-gateway\.database-int\.ts$''',
]
