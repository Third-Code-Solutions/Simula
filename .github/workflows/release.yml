name: Sigstore-signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Build, sign, and verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      SIMULA_ENVIRONMENT: test
      SIMULA_LOG_LEVEL: INFO
      SIMULA_RELEASE_SHA: ${{ github.sha }}
      SIMULA_SUPABASE_TEST_AS_ADMIN: "true"
      NEXT_PUBLIC_SIMULA_API_V1_URL: ${{ vars.NEXT_PUBLIC_SIMULA_API_V1_URL }}
      NEXT_PUBLIC_SIMULA_API_V2_URL: ${{ vars.NEXT_PUBLIC_SIMULA_API_V2_URL }}
      NEXT_PUBLIC_SIMULA_API_URL: ${{ vars.NEXT_PUBLIC_SIMULA_API_V1_URL }}
      NEXT_PUBLIC_SIMULA_DOMAIN_API_VERSION:
        ${{ vars.NEXT_PUBLIC_SIMULA_DOMAIN_API_VERSION }}
      NEXT_PUBLIC_SIMULA_ENVIRONMENT: production
      NEXT_PUBLIC_SIMULA_RELEASE_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SIMULA_TELEMETRY_ENABLED:
        ${{ vars.NEXT_PUBLIC_SIMULA_TELEMETRY_ENABLED }}
      NEXT_PUBLIC_SIMULA_WEB_URL: ${{ vars.NEXT_PUBLIC_SIMULA_WEB_URL }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout exact release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Install exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.19
          enable-cache: true

      - name: Install exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.14.7

      - name: Install exact pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.13.1

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          uv sync --frozen --all-packages --all-groups
          pnpm toolchain:check

      - name: Run release gates
        run: |
          set -euo pipefail
          docker compose up --detach --wait redis
          test "$(docker compose exec -T redis id -u)" != "0"
          pnpm exec supabase start --yes -x studio,imgproxy > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:54321/auth/v1/health
          pnpm exec playwright install --with-deps chromium
          pnpm verify
          pnpm observability:check
          pnpm behavioral:capacity

      - name: Stop disposable release services
        if: always()
        run: |
          pnpm exec supabase stop --no-backup || true
          docker compose down --volumes --remove-orphans

      - name: Build every production image from the release source
        run: |
          set -euo pipefail
          for variable in NEXT_PUBLIC_SIMULA_API_V1_URL NEXT_PUBLIC_SIMULA_API_V2_URL NEXT_PUBLIC_SIMULA_WEB_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!variable:-}" || { echo "Missing required Actions variable: ${variable}" >&2; exit 1; }
          done
          for variable in NEXT_PUBLIC_SIMULA_API_V1_URL NEXT_PUBLIC_SIMULA_API_V2_URL NEXT_PUBLIC_SIMULA_WEB_URL NEXT_PUBLIC_SUPABASE_URL; do
            case "${!variable}" in https://*) ;; *) echo "${variable} must use https://" >&2; exit 1 ;; esac
          done
          case "$NEXT_PUBLIC_SIMULA_DOMAIN_API_VERSION" in v1|v2) ;; *) echo "Invalid domain API version" >&2; exit 1 ;; esac
          case "$NEXT_PUBLIC_SIMULA_TELEMETRY_ENABLED" in true|false) ;; *) echo "Invalid telemetry flag" >&2; exit 1 ;; esac
          if test "$NEXT_PUBLIC_SIMULA_TELEMETRY_ENABLED" = true; then
            case "$NEXT_PUBLIC_SENTRY_DSN" in https://*) ;; *) echo "Telemetry requires an HTTPS Sentry DSN" >&2; exit 1 ;; esac
          fi
          test "$NEXT_PUBLIC_SIMULA_API_V1_URL" != "$NEXT_PUBLIC_SIMULA_API_V2_URL" || {
            echo "v1 and v2 API origins must be distinct" >&2
            exit 1
          }
          test "$NEXT_PUBLIC_SIMULA_API_URL" = "$NEXT_PUBLIC_SIMULA_API_V1_URL" || {
            echo "admin API origin must match the authoritative v1 origin" >&2
            exit 1
          }
          canary="SIMULA_BUNDLE_CANARY_$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "SIMULA_BUNDLE_SECRET_CANARY=$canary" >> "$GITHUB_ENV"
          docker build --pull \
            --secret id=simula_bundle_canary,env=SIMULA_BUNDLE_SECRET_CANARY \
            --build-arg NEXT_PUBLIC_SIMULA_API_V1_URL \
            --build-arg NEXT_PUBLIC_SIMULA_API_V2_URL \
            --build-arg NEXT_PUBLIC_SIMULA_DOMAIN_API_VERSION \
            --build-arg NEXT_PUBLIC_SIMULA_ENVIRONMENT \
            --build-arg NEXT_PUBLIC_SIMULA_RELEASE_SHA \
            --build-arg NEXT_PUBLIC_SIMULA_TELEMETRY_ENABLED \
            --build-arg NEXT_PUBLIC_SIMULA_WEB_URL \
            --build-arg NEXT_PUBLIC_SENTRY_DSN \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --tag simula-web:release --file apps/web/Dockerfile .
          docker build --pull --tag simula-api:release --file services/api/Dockerfile .
          docker build --pull --tag simula-control-plane:release --file apps/api/Dockerfile .
          docker build --pull --tag simula-worker:release --file services/worker/Dockerfile .
          docker build --pull --tag simula-ai-engine:release --file services/ai-engine/Dockerfile .
          test "$(docker image inspect --format '{{.Config.User}}' simula-web:release)" = "node"
          test "$(docker image inspect --format '{{.Config.User}}' simula-api:release)" = "simula"
          test "$(docker image inspect --format '{{.Config.User}}' simula-control-plane:release)" = "simula"
          test "$(docker image inspect --format '{{.Config.User}}' simula-worker:release)" = "simula"
          test "$(docker image inspect --format '{{.Config.User}}' simula-ai-engine:release)" = "simula"
          docker run --rm simula-api:release python -c "import simula_api"
          docker run --rm simula-control-plane:release node -e "require('./dist/application')"
          docker run --rm simula-worker:release python -m simula_worker --check
          docker run --rm simula-ai-engine:release python -c "import simula_ai_engine"
          install -d release
          : > release/image-identities.txt
          for image in web api control-plane worker ai-engine; do
            image_id="$(docker image inspect "simula-${image}:release" --format '{{.Id}}')"
            printf '%s=%s\n' "simula-${image}" "$image_id" >> release/image-identities.txt
          done

      - name: Install checksum-pinned image scanners
        env:
          GRYPE_SHA256: 40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5
          GRYPE_VERSION: 0.116.0
          SYFT_SHA256: 6cef9a7f37220d9067eaf9cfaaa2fce986e9f320a8d42cbc36658c99af78ea04
          SYFT_VERSION: 1.48.0
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/simula-security/bin"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/simula-security/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/simula-security/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/simula-security/syft.tar.gz" \
            --directory "$RUNNER_TEMP/simula-security/bin" syft
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/simula-security/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $RUNNER_TEMP/simula-security/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/simula-security/grype.tar.gz" \
            --directory "$RUNNER_TEMP/simula-security/bin" grype
          echo "$RUNNER_TEMP/simula-security/bin" >> "$GITHUB_PATH"

      - name: Reclaim Docker build cache before SBOM binding
        run: |
          set -euo pipefail
          # The release images are tagged and must remain available for Syft. Only
          # dangling images and unreferenced BuildKit cache are safe to reclaim.
          docker image prune --force
          docker builder prune --all --force

      - name: Bind SBOMs and block fixable High or Critical findings
        run: |
          set -euo pipefail
          install -d release/security
          failed=0
          for image in web api control-plane worker ai-engine; do
            syft "docker:simula-${image}:release" \
              --output "cyclonedx-json=release/security/simula-${image}.cdx.json"
            # Syft has fully materialized the SBOM, so this tagged image is no
            # longer needed. Removing it bounds runner disk use for later scans.
            docker image rm "simula-${image}:release"
            docker builder prune --all --force
            grype "sbom:release/security/simula-${image}.cdx.json" \
              --config .grype.yaml \
              --output json \
              --file "release/security/simula-${image}.grype.json"
            grype "sbom:release/security/simula-${image}.cdx.json" \
              --config .grype.yaml \
              --only-fixed \
              --fail-on high \
              --output table || failed=1
          done
          syft "dir:apps/admin/.next/standalone" \
            --output "cyclonedx-json=release/security/simula-admin.cdx.json"
          grype "sbom:release/security/simula-admin.cdx.json" \
            --config .grype.yaml \
            --output json \
            --file "release/security/simula-admin.grype.json"
          grype "sbom:release/security/simula-admin.cdx.json" \
            --config .grype.yaml \
            --only-fixed \
            --fail-on high \
            --output table || failed=1
          exit "$failed"

      - name: Build Python wheels
        run: |
          set -euo pipefail
          install -d release/wheels
          uv build --package simula-core --out-dir release/wheels
          uv build --package simula-api --out-dir release/wheels
          uv build --package simula-worker --out-dir release/wheels
          uv build --package simula-ai-engine --out-dir release/wheels

      - name: Assemble deterministic release bundle
        run: |
          set -euo pipefail
          install -d release/stage
          cp -R apps/api/dist release/stage/control-plane
          cp apps/api/openapi.json release/stage/openapi.json
          cp -R apps/web/.next/standalone release/stage/web
          cp -R apps/web/.next/static release/stage/web-static
          cp -R apps/admin/.next/standalone release/stage/admin
          cp -R apps/admin/.next/static release/stage/admin-static
          cp -R packages/contracts/dist release/stage/contracts
          cp packages/contracts/*.schema.json release/stage/
          cp railway.*.json release/stage/
          cp apps/api/Dockerfile release/stage/control-plane.Dockerfile
          cp apps/web/Dockerfile release/stage/web.Dockerfile
          cp services/api/Dockerfile release/stage/api-rollback.Dockerfile
          cp services/worker/Dockerfile release/stage/worker.Dockerfile
          cp services/ai-engine/Dockerfile release/stage/ai-engine.Dockerfile
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml \
            pyproject.toml uv.lock release/stage/
          cp release/image-identities.txt release/stage/
          cp -R release/security release/stage/security
          cp -R release/wheels release/stage/wheels
          printf '%s\n' "$GITHUB_SHA" > release/stage/RELEASE_SHA
          uv run --frozen python -m scripts.release_manifest
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            -C release/stage -cf - . \
            | gzip -n > "release/simula-${GITHUB_SHA}.tar.gz"
          sha256sum "release/simula-${GITHUB_SHA}.tar.gz" \
            | sed 's#release/##' > release/SHA256SUMS

      - name: Install exact Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify release provenance
        run: |
          set -euo pipefail
          artifact="release/simula-${GITHUB_SHA}.tar.gz"
          bundle="${artifact}.sigstore.json"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign sign-blob --yes --bundle "$bundle" "$artifact"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            "$artifact"

      - name: Bind the Sigstore verification bundle
        run: |
          set -euo pipefail
          test -s "release/simula-${GITHUB_SHA}.tar.gz.sigstore.json"
          sha256sum "release/simula-${GITHUB_SHA}.tar.gz.sigstore.json" \
            | sed 's#release/##' > release/SIGSTORE_BUNDLE_SHA256

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simula-signed-${{ github.sha }}
          path: |
            release/simula-${{ github.sha }}.tar.gz
            release/simula-${{ github.sha }}.tar.gz.sigstore.json
            release/SHA256SUMS
            release/SIGSTORE_BUNDLE_SHA256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failed browser gate evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-failure-${{ github.sha }}
          path: |
            .playwright-cli/p2-*.log
            .playwright-cli/p2-readiness.json
            test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
