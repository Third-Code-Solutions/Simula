name: Sigstore-signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Build, sign, and verify release
    runs-on: [self-hosted, Windows, X64, simula-release]
    timeout-minutes: 40
    defaults:
      run:
        shell: "D:\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SIMULA_ENVIRONMENT: test
      SIMULA_LOG_LEVEL: INFO
      SIMULA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install exact uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.19
          enable-cache: true

      - name: Install exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.14.6

      - name: Install exact pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.13.1

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          uv sync --frozen --all-packages --all-groups
          pnpm toolchain:check

      - name: Run release gates
        run: |
          set -euo pipefail
          pnpm check
          pnpm security:sca
          pnpm observability:check
          pnpm behavioral:capacity

      - name: Build Python wheels
        run: |
          set -euo pipefail
          install -d release/wheels
          uv build --package simula-core --out-dir release/wheels
          uv build --package simula-api --out-dir release/wheels
          uv build --package simula-worker --out-dir release/wheels
          uv build --package simula-ai-engine --out-dir release/wheels

      - name: Assemble deterministic release bundle
        run: |
          set -euo pipefail
          install -d release/stage
          cp -R apps/api/dist release/stage/control-plane
          cp apps/api/openapi.json release/stage/openapi.json
          cp -R apps/web/.next/standalone release/stage/web
          cp -R apps/web/.next/static release/stage/web-static
          cp -R packages/contracts/dist release/stage/contracts
          cp packages/contracts/*.schema.json release/stage/
          cp railway.*.json release/stage/
          cp apps/api/Dockerfile release/stage/control-plane.Dockerfile
          cp apps/web/Dockerfile release/stage/web.Dockerfile
          cp services/api/Dockerfile release/stage/api-rollback.Dockerfile
          cp services/worker/Dockerfile release/stage/worker.Dockerfile
          cp services/ai-engine/Dockerfile release/stage/ai-engine.Dockerfile
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml \
            pyproject.toml uv.lock release/stage/
          cp -R release/wheels release/stage/wheels
          printf '%s\n' "$GITHUB_SHA" > release/stage/RELEASE_SHA
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            -C release/stage -cf - . \
            | gzip -n > "release/simula-${GITHUB_SHA}.tar.gz"
          sha256sum "release/simula-${GITHUB_SHA}.tar.gz" \
            | sed 's#release/##' > release/SHA256SUMS

      - name: Sign and verify release provenance
        uses: sigstore/gh-action-sigstore-python@f832326173235dcb00dd5d92cd3f353de3188e6c # v3.1.0
        with:
          inputs: release/simula-${{ github.sha }}.tar.gz
          release-signing-artifacts: false
          upload-signing-artifacts: false
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Bind the Sigstore verification bundle
        run: |
          set -euo pipefail
          test -s "release/simula-${GITHUB_SHA}.tar.gz.sigstore.json"
          sha256sum "release/simula-${GITHUB_SHA}.tar.gz.sigstore.json" \
            | sed 's#release/##' > release/SIGSTORE_BUNDLE_SHA256

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simula-signed-${{ github.sha }}
          path: |
            release/simula-${{ github.sha }}.tar.gz
            release/simula-${{ github.sha }}.tar.gz.sigstore.json
            release/SHA256SUMS
            release/SIGSTORE_BUNDLE_SHA256
          if-no-files-found: error
          retention-days: 30
