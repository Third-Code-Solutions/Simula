[project]
name = "simula-api"
version = "0.0.0"
description = "SIMULA public HTTP authority"
requires-python = "==3.14.6"
dependencies = [
    "cryptography==49.0.0",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "prometheus-client==0.25.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt==2.13.0",
    "simula-core",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "uvicorn==0.51.0",
]

[build-system]
requires = ["uv_build==0.11.19"]
build-backend = "uv_build"

[tool.uv.sources]
simula-core = { workspace = true }
